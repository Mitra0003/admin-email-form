services:
  - type: web
    name: admin-email-form
    runtime: node
    plan: free
    rootDir: admin-email-form
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MAIL_MODE
        value: smtp
      - key: ADMIN_EMAIL
        value: mitrasyaputra00@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: mitrasyaputra00@gmail.com
      - key: SMTP_FROM
        value: Admin Form <mitrasyaputra00@gmail.com>
      - key: SMTP_PASS
        sync: false
      - key: ADMIN_ACCESS_TOKEN
        sync: false
